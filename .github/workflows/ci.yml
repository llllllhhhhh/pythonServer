name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: xuetuxing_test
          MYSQL_USER: xuetuxing
          MYSQL_PASSWORD: xuetuxing-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      ENVIRONMENT: test
      APP_SECRET_KEY: test-secret-key-with-at-least-32-characters
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: xuetuxing
      MYSQL_PASSWORD: xuetuxing-test-password
      MYSQL_DATABASE: xuetuxing_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5178
      RUN_DATABASE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m compileall -q app migrations tests
      - run: python -m unittest discover -s tests -v
